name: twizzledart
description: "Interactive 3D Rubik's Cube Flutter plugin powered by WebGPU (Vulkan/Metal/DirectX)."
version: 0.1.0
homepage:

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.twizzledart.twizzledart
        pluginClass: TwizzledartPlugin
      windows:
        pluginClass: TwizzledartPluginCApi
        fileName: twizzledart_plugin_c_api.h
      linux:
        pluginClass: TwizzledartPlugin
      ios:
        pluginClass: TwizzledartPlugin
      macos:
        pluginClass: TwizzledartPlugin
